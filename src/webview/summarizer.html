<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline';">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 12px; }
    #spinner { display: none; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    #controls { margin-bottom: 8px; }
    button { margin-right: 6px; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="cancel">Cancel</button>
    <span id="spinner">⏳ Summarizing…</span>
  </div>
  <div id="summary"><pre>(waiting...)</pre></div>
  <script>
    const vscode = acquireVsCodeApi();
    document.getElementById('cancel').addEventListener('click', () => {
      vscode.postMessage({ command: 'cancel' });
    });

    window.addEventListener('message', event => {
      const msg = event.data;
      if (msg.command === 'status') {
        if (msg.status === 'starting') {
          document.getElementById('spinner').style.display = 'inline';
          document.getElementById('summary').innerHTML = '<pre>(summarizing…)</pre>';
        }
      }
      if (msg.command === 'show') {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('summary').innerHTML = `<pre>${escapeHtml(msg.summary)}</pre>`;
      }
      if (msg.command === 'error') {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('summary').innerHTML = `<pre>Error: ${escapeHtml(msg.error)}</pre>`;
      }
      if (msg.command === 'canceled') {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('summary').innerHTML = `<pre>Summary canceled.</pre>`;
      }
    });

    function escapeHtml(unsafe) {
      return unsafe
+        .replace(/&/g, '&amp;')
+        .replace(/</g, '&lt;')
+        .replace(/>/g, '&gt;')
+        .replace(/"/g, '&quot;')
+        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
