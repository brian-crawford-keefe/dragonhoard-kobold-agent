name: CI - Build Backend and VSIX

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore backend
        run: dotnet restore KoboldBrain/KoboldBrain.csproj

      - name: Publish backend (Release)
        run: dotnet publish KoboldBrain/KoboldBrain.csproj -c Release -o ${{ github.workspace }}\artifacts\KoboldBrain

      - name: Build VSIX project
        shell: pwsh
        run: |
          # Restore and build the VSIX using msbuild (Visual Studio is available on windows runners)
          msbuild DragonHoard.VSIX/DragonHoard.VSIX.csproj /t:Restore,Build /p:Configuration=Release

      - name: Package VS Code extension (vsce) and collect .vsix
        shell: pwsh
        run: |
          # Ensure Node is available on the runner
          node --version
          npm --version
          # Install Node dependencies and build the extension
          npm ci
          npm run compile
          # Install vsce globally and package the extension
          npm install -g vsce@2.12.0
          npx vsce package -o "${{ github.workspace }}\artifacts\vscode\kobold-clan-agent.vsix"
          # Ensure the artifacts directory exists and copy vsix into the common artifacts folder
          $out = Join-Path $Env:GITHUB_WORKSPACE 'artifacts\VSIX'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "${{ github.workspace }}\artifacts\vscode\kobold-clan-agent.vsix" -Destination $out -Force

      - name: Collect VSIX artifacts
        shell: pwsh
        run: |
          $out = Join-Path $Env:GITHUB_WORKSPACE 'artifacts\VSIX'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Path DragonHoard.VSIX\bin -Recurse -Filter *.vsix | ForEach-Object { Copy-Item $_.FullName -Destination $out -Force }
          Get-ChildItem -Path DragonHoard.VSIX\bin -Recurse -Filter *.nupkg | ForEach-Object { Copy-Item $_.FullName -Destination $out -Force }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kobold-artifacts
          path: |
            artifacts\KoboldBrain
            artifacts\VSIX
